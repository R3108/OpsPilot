# Local development stack.
#
#   docker compose up --build
#   docker compose exec api alembic upgrade head
#   docker compose exec api python -m app.cli seed
#
# The API and the worker run the same image with different commands: the worker
# is where investigations actually execute, so restarting the API never
# interrupts one in flight.

name: opspilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/app
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@postgres:5432/opspilot
      CHECKPOINT_DATABASE_URL: postgresql://opspilot:opspilot@postgres:5432/opspilot
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-in-production-1234567890}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPSPILOT_MODEL: ${OPSPILOT_MODEL:-claude-sonnet-5}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-openai/gpt-oss-120b}
      NVIDIA_MODEL_FAST: ${NVIDIA_MODEL_FAST:-nvidia/nemotron-3.5-lightning-30b-a3b}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-opspilot}
      REMEDIATION_DISABLED: ${REMEDIATION_DISABLED:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
    command: arq app.workers.main.WorkerSettings
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@postgres:5432/opspilot
      CHECKPOINT_DATABASE_URL: postgresql://opspilot:opspilot@postgres:5432/opspilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-in-production-1234567890}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPSPILOT_MODEL: ${OPSPILOT_MODEL:-claude-sonnet-5}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-openai/gpt-oss-120b}
      NVIDIA_MODEL_FAST: ${NVIDIA_MODEL_FAST:-nvidia/nemotron-3.5-lightning-30b-a3b}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-opspilot}
      REMEDIATION_DISABLED: ${REMEDIATION_DISABLED:-false}
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
