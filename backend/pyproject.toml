[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot AI - autonomous AI SRE / incident response platform"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "email-validator>=2.0.0",
  "pydantic-settings>=2.14.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "arq>=0.26.1",
  "httpx>=0.27.2",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "cryptography>=43.0.0",
  "python-multipart>=0.0.17",
  "structlog>=24.4.0",
  "orjson>=3.10.10",
  "tenacity>=9.0.0",
  "langgraph>=0.2.45",
  "langgraph-checkpoint-postgres>=2.0.2",
  "langchain-core>=0.3.15",
  "langchain-anthropic>=0.3.0",
  # OpenAI-compatible transport; this is how we talk to NVIDIA NIM.
  "langchain-openai>=0.2.9",
  "langsmith>=0.1.140",
  "psycopg[binary,pool]>=3.2.3",
  "pgvector>=0.3.6",
  "sse-starlette>=2.1.3",
  "slack-sdk>=3.33.0",
  "kubernetes-asyncio>=31.1.0",
  "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "aiosqlite>=0.20.0",
  "respx>=0.21.1",
  "ruff>=0.7.3",
  "mypy>=1.13.0",
  "types-passlib",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = [
  "S101",     # assert: used deliberately in tests and for invariants
  "B008",     # function call in default arg: this is how FastAPI Depends works
  "S105",     # "possible hardcoded password": fires on literals like "access"
  "S106",
  "S107",
  "ASYNC109", # our own `timeout` params are passed to asyncio.wait_for, not slept on
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017", "ASYNC230", "ASYNC240", "C408", "E501"]
"app/evals/*" = ["S", "ASYNC230"]   # the CLI report writer is intentionally sync
# Prompt text and the heuristic signature table are prose and data tables; hard
# wrapping them at 100 columns makes them harder to read, not easier.
"app/agents/prompts.py" = ["E501"]
"app/agents/heuristics.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
