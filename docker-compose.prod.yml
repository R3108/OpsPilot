# Production overlay:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the dev stack that actually matter:
#   * no source bind-mounts, no --reload, no exposed database ports
#   * every secret comes from the environment with no default — the app refuses
#     to boot in production without them (see Settings.validate_production)
#   * resource limits and replica counts, so one runaway investigation cannot
#     starve the API
#   * migrations run once, in their own container, before the API starts

services:
  postgres:
    ports: []
    restart: always
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c log_min_duration_statement=1000
    # NOTE: `deploy.resources` below is honoured by `docker stack deploy`
    # (Swarm) only — plain `docker compose up` ignores it. The mem_limit/cpus
    # keys next to it are what actually constrain the container here.
    mem_limit: 2g
    cpus: 2.0
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    ports: []
    restart: always
    mem_limit: 768m
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
    # The backend image's HEALTHCHECK probes :8000/health/live, which neither
    # the one-shot migrate container nor the arq worker serve — never let the
    # orchestrator judge them by it.
    healthcheck:
      disable: true
    restart: "no"

  api:
    build:
      context: ./backend
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --workers 4
      --proxy-headers --forwarded-allow-ips '*'
      --no-server-header
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CHECKPOINT_DATABASE_URL: ${CHECKPOINT_DATABASE_URL:?CHECKPOINT_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # Settings.validate_production() fails the boot if the key for the
      # selected provider is missing, so the keys stay optional here.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPSPILOT_MODEL: ${OPSPILOT_MODEL:-claude-sonnet-5}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-openai/gpt-oss-120b}
      NVIDIA_MODEL_FAST: ${NVIDIA_MODEL_FAST:-nvidia/nemotron-3.5-lightning-30b-a3b}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-true}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-opspilot-production}
      REMEDIATION_DISABLED: ${REMEDIATION_DISABLED:-false}
    volumes: []
    restart: always
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  worker:
    build:
      context: ./backend
    command: arq app.workers.main.WorkerSettings
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CHECKPOINT_DATABASE_URL: ${CHECKPOINT_DATABASE_URL:?CHECKPOINT_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # Settings.validate_production() fails the boot if the key for the
      # selected provider is missing, so the keys stay optional here.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPSPILOT_MODEL: ${OPSPILOT_MODEL:-claude-sonnet-5}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-openai/gpt-oss-120b}
      NVIDIA_MODEL_FAST: ${NVIDIA_MODEL_FAST:-nvidia/nemotron-3.5-lightning-30b-a3b}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-true}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-opspilot-production}
      REMEDIATION_DISABLED: ${REMEDIATION_DISABLED:-false}
    volumes: []
    restart: always
    mem_limit: 2g
    cpus: 2.0
    # See migrate: the arq worker does not serve the API health endpoint.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      # More than one worker is safe: investigations are guarded by a Redis
      # advisory lock per incident, and the LangGraph checkpointer is shared.
      # NOTE: replicas is Swarm-only; with plain compose use --scale worker=2.
      replicas: 2
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    environment:
      NODE_ENV: production
    restart: always
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Nightly pg_dump to a local volume. Opt-in: `docker compose --profile backup
  # up backup`. Offload /backups to S3 on a host cron; see docs/RUNBOOK.md.
  backup:
    image: pgvector/pgvector:pg16
    profiles: [backup]
    command: >
      sh -c 'stamp=$$(date -u +%Y%m%dT%H%M%SZ);
      pg_dump "$DATABASE_URL" | gzip > /backups/opspilot-$${stamp}.sql.gz'
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    volumes:
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # TLS-terminating reverse proxy (Caddy + automatic Let's Encrypt).
  # Opt-in: `docker compose --profile edge up proxy`. Set DOMAIN and CONTACT_EMAIL;
  # api/web stay on the internal network only. See docs/RUNBOOK.md.
  proxy:
    image: caddy:2-alpine
    profiles: [edge]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required for the edge profile}
      CONTACT_EMAIL: ${CONTACT_EMAIL:?CONTACT_EMAIL is required for the edge profile}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres-backups:
  caddy-data:
  caddy-config:
